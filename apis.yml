description: 'Eo Computer (EO, Inc.) was an early-1990s hardtech company, backed by Kleiner Perkins,
  that built the EO Personal Communicator - a pen-based tablet computer running GO Corporation''s PenPoint
  operating system. AT&T became the principal backer and later shut the company down in 1994. The company
  is defunct: it has no website, developer program, public API, SDKs, or any published developer surface,
  so there is nothing for the API Evangelist enrichment pipeline to search, generate, or derive. This
  profile is retained as a historical portfolio record of a dead, non-API hardware company.'
